    <style>
      /* Ajustes globais para evitar sobreposições e garantir espaçamento correto dos botões do sistema */
      html, body {
        background-color: #0B1220 !important;
        color: #f1f5f9 !important;
        padding-bottom: env(safe-area-inset-bottom, 24px) !important;
      }
      /* Garante que o conteúdo rolável não fique escondido atrás do menu inferior ou botões do sistema */
      #root > div {
        padding-bottom: 96px !important;
      }
    </style>
    <script>
      // Script de correção em tempo de execução para remover botão de tema, botão topo e ajustar menu inferior
      const observer = new MutationObserver(() => {
        // 1. Força dark mode
        document.documentElement.classList.add('dark');

        // 2. Remove botões de tema claro/escuro no header
        const headerButtons = document.querySelectorAll('header button');
        headerButtons.forEach(btn => {
          const text = btn.innerText || '';
          if (text.includes('Claro') || text.includes('Escuro') || text.includes('Tema') || btn.querySelector('svg.lucide-sun, svg.lucide-moon')) {
            btn.style.display = 'none';
          }
        });

        // 3. Remove botões de lançamento duplicados no topo se houver
        const topActionBtns = document.querySelectorAll('header .flex.items-center.space-x-2 button');
        topActionBtns.forEach(btn => {
          const text = btn.innerText || '';
          if (text.includes('Novo') || text.includes('Lançamento') || btn.querySelector('svg.lucide-plus')) {
            btn.style.display = 'none';
          }
        });

        // 4. Ajusta o menu inferior para que o botão de novo lançamento fique integrado no meio
        const nav = document.querySelector('nav');
        if (nav) {
          nav.style.paddingBottom = 'calc(env(safe-area-inset-bottom, 16px) + 4px)';
          nav.style.backgroundColor = 'rgba(11, 18, 32, 0.95)';
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </head>
  <body class="bg-[#0B1220] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
